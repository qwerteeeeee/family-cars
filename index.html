<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Reservation</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBvXKM44IxS2xbQWCvJz1VQmVGLgkEoWLE",
    authDomain: "family-cars-9979d.firebaseapp.com",
    projectId: "family-cars-9979d",
    storageBucket: "family-cars-9979d.firebasestorage.app",
    messagingSenderId: "966657184208",
    appId: "1:966657184208:web:dcd02c70ddbca259f9e9d5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC_REF = doc(db, "family", "reservations");

window._db = { db, doc, getDoc, setDoc, onSnapshot, DOC_REF };
window._firebaseReady = true;
document.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f7f5;
    --bg3: #f0efec;
    --text: #1a1a1a;
    --text2: #666;
    --text3: #999;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius: 10px;
    --radius-sm: 6px;
    --font: 'Sarabun', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --bg2: #2c2c2e; --bg3: #3a3a3c;
      --text: #f5f5f5; --text2: #aaa; --text3: #666;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap');

  header {
    padding: 18px 20px 14px; border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .app-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .app-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }

  .sync-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text3);
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: 20px; padding: 4px 10px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4cd964; transition: background 0.3s; }
  .sync-dot.loading { background: #ff9500; animation: blink 0.9s infinite; }
  .sync-dot.err { background: #ff3b30; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .main { padding: 16px 16px 100px; max-width: 480px; margin: 0 auto; }

  .month-nav {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .month-nav button {
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); width: 36px; height: 36px;
    cursor: pointer; font-size: 18px; color: var(--text2);
    display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:hover { background: var(--bg3); }
  .month-label { font-size: 16px; font-weight: 600; }

  /* Legend: car colors only */
  .legend { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .li { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
  .ld { width: 8px; height: 8px; border-radius: 50%; }
  .ly { background: #a0a09e; } .lc { background: #5a8fc4; }

  /* Calendar grid */
  .cal-grid {
    display: grid; grid-template-columns: repeat(7,1fr);
    border-left: 0.5px solid var(--border); border-top: 0.5px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .dow-head {
    text-align: center; padding: 9px 2px; font-size: 11px;
    color: var(--text3); font-weight: 500;
    border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border);
    background: var(--bg2);
  }
  .dow-sun { color: #e05050; } .dow-sat { color: #3a80c4; }

  .day-cell {
    border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border);
    min-height: 68px; padding: 5px 4px 4px;
    cursor: pointer; transition: background 0.1s;
    display: flex; flex-direction: column; background: var(--bg);
    overflow: hidden;
  }
  .day-cell:hover { background: var(--bg2); }
  .day-cell.dim { opacity: 0.28; pointer-events: none; }

  .day-num {
    font-size: 13px; margin-bottom: 3px; line-height: 1;
    display: flex; align-items: center; flex-shrink: 0;
  }
  .day-num span {
    width: 22px; height: 22px; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 50%;
  }
  .day-num.today span { background: var(--text); color: var(--bg); }
  .day-num.dsun { color: #e05050; } .day-num.dsat { color: #3a80c4; }

  /* Pill strip — horizontal scroll, snaps per pill */
  .pill-strip {
    flex: 1; display: flex; flex-direction: row;
    overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    gap: 0; align-items: flex-start;
  }
  .pill-strip::-webkit-scrollbar { display: none; }

  .pill {
    scroll-snap-align: start; flex: 0 0 100%;
    border-radius: 4px; font-size: 11px; font-weight: 500;
    padding: 2px 5px; margin-top: 0;
    display: flex; align-items: flex-start; gap: 2px;
    cursor: pointer; min-width: 0;
  }

  /* Car-colored pills */
  .pyaris { background: #f0f0ee; color: #2a2a2a; }
  .pcity  { background: #ddeaf6; color: #1c3a52; }
  @media (prefers-color-scheme: dark) {
    .pyaris { background: #3a3a3c; color: #e8e8e8; }
    .pcity  { background: #0a1e30; color: #7ab8dc; }
  }

  .pill-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .pill-name { font-size: 11px; font-weight: 600; }
  .pill-t { font-size: 9px; opacity: 0.8; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Scroll-dot indicator */
  .strip-dots { display: flex; justify-content: center; gap: 3px; margin-top: 3px; flex-shrink: 0; }
  .sd { width: 4px; height: 4px; border-radius: 50%; background: var(--border2); transition: background 0.2s; }
  .sd.active { background: var(--text3); }

  .plus-hint { color: var(--text3); opacity: 0.2; font-size: 15px; margin-top: auto; text-align: center; }

  /* ── Modal base ── */
  .modal-wrap {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .modal-wrap.open { display: flex; }
  .modal {
    background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 20px 20px 36px; width: 100%; max-width: 480px;
    border-top: 0.5px solid var(--border2);
    max-height: 92vh; overflow-y: auto;
  }
  .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .modal-sub { font-size: 12px; color: var(--text3); margin-bottom: 18px; min-height: 16px; }
  .sec { font-size: 11px; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* Car selection row */
  .car-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }

  /* Person row */
  .p-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }

  .pb {
    border: 0.5px solid var(--border); border-radius: var(--radius);
    padding: 10px 4px; text-align: center; cursor: pointer;
    font-size: 13px; font-weight: 500; background: var(--bg2);
    color: var(--text); font-family: var(--font); transition: all 0.12s;
  }
  .pb:hover { background: var(--bg3); }

  /* Car button selected states */
  .pby { background: #f0f0ee; color: #2a2a2a; border-color: #999; }
  .pbc { background: #ddeaf6; color: #1c3a52; border-color: #5a8fc4; }
  @media (prefers-color-scheme: dark) {
    .pby { background: #3a3a3c; color: #e8e8e8; border-color: #888; }
    .pbc { background: #0a1e30; color: #7ab8dc; border-color: #3a6a8a; }
  }

  /* Person button selected states */
  .pbz { background: #ede5fa; color: #4a2e8a; border-color: #c4aeed; }
  .pbm { background: #fff0e6; color: #a04a10; border-color: #f4b07a; }
  .pbg { background: #e3f5ec; color: #155e40; border-color: #80d4a8; }
  @media (prefers-color-scheme: dark) {
    .pbz { background: #3b2a6a; color: #d4b8ff; border-color: #7a5acc; }
    .pbm { background: #5a2e0a; color: #ffcba0; border-color: #c07a3a; }
    .pbg { background: #0e3d26; color: #7adcab; border-color: #3a9a6a; }
  }

  /* Avatar circles */
  .av {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; margin: 0 auto 6px;
  }
  .avy { background: #d0d0ce; color: #2a2a2a; }
  .avc { background: #5a8fc4; color: #fff; }
  .avz { background: #c4aeed; color: #3d2870; }
  .avm { background: #f4b07a; color: #7a3a0d; }
  .avg { background: #80d4a8; color: #0e4a30; }

  /* ── Time slider ── */
  .time-disp {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 20px; font-weight: 600;
    margin-bottom: 12px; letter-spacing: 0.3px;
  }
  .time-disp .t-sep { color: var(--text3); font-weight: 300; font-size: 16px; }
  .dual-slider { position: relative; height: 32px; margin-bottom: 4px; }
  .dual-track {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 4px; left: 12px; right: 12px;
    background: var(--bg3); border-radius: 2px; pointer-events: none;
  }
  .dual-fill { position: absolute; height: 100%; background: var(--text); border-radius: 2px; }
  .t-thumb {
    position: absolute; width: 100%; height: 32px; top: 0; left: 0;
    margin: 0; padding: 0;
    -webkit-appearance: none; appearance: none;
    background: transparent; pointer-events: none;
  }
  .t-thumb::-webkit-slider-runnable-track { background: transparent; height: 4px; }
  .t-thumb::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--border2);
    box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    pointer-events: all; cursor: pointer; margin-top: -10px;
  }
  .time-range-hint {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--text3); margin-bottom: 16px; padding: 0 2px;
  }

  /* ── Repeat row ── */
  .rep-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .rb {
    border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 8px; font-size: 12px; cursor: pointer;
    background: var(--bg2); color: var(--text); text-align: center;
    font-family: var(--font); transition: all 0.12s;
  }
  .rb:hover { background: var(--bg3); }
  .rb.ron { background: var(--text); color: var(--bg); border-color: var(--text); }

  .cfm {
    width: 100%; border: none; border-radius: var(--radius);
    padding: 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; background: var(--text); color: var(--bg);
    margin-bottom: 10px; font-family: var(--font); transition: opacity 0.15s;
  }
  .cfm:disabled { opacity: 0.3; cursor: default; }
  .ccl {
    width: 100%; border: none; background: none;
    color: var(--text3); font-size: 13px; cursor: pointer;
    padding: 6px; font-family: var(--font);
  }

  /* ── View detail modal ── */
  .det-card {
    background: var(--bg2); border-radius: var(--radius);
    border: 0.5px solid var(--border); padding: 16px; margin-bottom: 20px;
  }
  .det-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .det-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .det-value { font-size: 15px; font-weight: 600; }
  .det-vz { color: #4a2e8a; } .det-vm { color: #a04a10; } .det-vg { color: #155e40; }
  .det-vy { color: #555555; } .det-vc { color: #1c3a52; }
  @media (prefers-color-scheme: dark) {
    .det-vz { color: #d4b8ff; } .det-vm { color: #ffcba0; } .det-vg { color: #7adcab; }
    .det-vy { color: #cccccc; } .det-vc { color: #7ab8dc; }
  }
  .det-time-full { margin-top: 14px; padding-top: 14px; border-top: 0.5px solid var(--border); }
  .det-time-bar { height: 6px; background: var(--bg3); border-radius: 3px; margin-top: 8px; position: relative; overflow: hidden; }
  .det-time-fill { position: absolute; height: 100%; background: var(--text); border-radius: 3px; }
  .det-card { margin-bottom: 12px; }
  .det-card-hd {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .del-mini {
    border: 0.5px solid rgba(255,59,48,0.35); background: none; color: #ff3b30;
    font-size: 12px; font-weight: 500; cursor: pointer;
    padding: 5px 12px; border-radius: var(--radius-sm); font-family: var(--font);
    transition: background 0.12s;
  }
  .del-mini:active { background: rgba(255,59,48,0.08); }

  .config-banner {
    background: #fff8e1; border: 1px solid #ffe082;
    border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 16px; font-size: 13px; color: #5a4000; line-height: 1.6;
  }
  .config-banner strong { display: block; margin-bottom: 4px; font-size: 14px; }
</style>
</head>
<body>

<header>

<script>
const MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DEN_TH=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DOW_TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];

let mo=0, res={}, pend={};

function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isT(d){const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear()}

function getResData(rv){
  if(!rv) return null;
  if(typeof rv==='string') return {person:rv,startTime:null,endTime:null};
  return rv;
}

function tickToTime(v){
  v=Math.min(96,Math.max(0,v));
  if(v===96) return '24:00';
  const h=Math.floor(v/4),m=(v%4)*15;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function timeToTick(t){
  if(!t) return 0;
  const [h,m]=t.split(':').map(Number);
  return Math.round((h*60+m)/15);
}

function setSync(state,txt){
  document.getElementById('sdot').className='sync-dot'+(state==='loading'?' loading':state==='err'?' err':'');
  document.getElementById('stxt').textContent=txt;
}

// ── Firebase ──────────────────────────────────────────
function setupFirebase(){
  const {onSnapshot,DOC_REF}=window._db;
  onSnapshot(DOC_REF, snap=>{
    res=snap.exists()?snap.data().reservations||{}:{};
    render();
    setSync('ok','ซิงค์แล้ว');
  }, err=>{ setSync('err','เชื่อมต่อไม่ได้'); console.error(err); });
}

async function saveToFirebase(){
  if(!window._firebaseReady) return;
  const {setDoc,DOC_REF}=window._db;
  setSync('loading','กำลังบันทึก...');
  try{
    await setDoc(DOC_REF,{reservations:res,updatedAt:new Date().toISOString()});
    setSync('ok','บันทึกแล้ว');
  } catch(e){ setSync('err','บันทึกไม่ได้'); console.error(e); }
}

function checkConfig(){
  for(const s of document.querySelectorAll('script[type="module"]')){
    if(s.textContent.includes('YOUR_API_KEY')){
      document.getElementById('config-banner').style.display='block';
      setSync('err','ยังไม่ตั้งค่า'); return false;
    }
  }
  return true;
}

// ── Calendar ──────────────────────────────────────────
function chMonth(d){mo+=d;render()}

function updTime(which){
  let s=parseInt(document.getElementById('t-start').value);
  let e=parseInt(document.getElementById('t-end').value);
  if(which==='start'&&s>e){s=e;document.getElementById('t-start').value=s;}
  if(which==='end'&&e<s){e=s;document.getElementById('t-end').value=e;}
  pend.startTime=tickToTime(s);
  pend.endTime=tickToTime(e);
  document.getElementById('t-start-lbl').textContent=pend.startTime;
  document.getElementById('t-end-lbl').textContent=pend.endTime;
  const fill=document.getElementById('t-fill');
  fill.style.left=(s/96*100)+'%';
  fill.style.width=((e-s)/96*100)+'%';
}

function openMod(ds){
  const d=new Date(ds+'T12:00:00');
  pend={ds,car:null,person:null,rep:'none',startTime:'08:00',endTime:'18:00'};
  document.getElementById('mt').textContent='วัน'+DOW_TH[d.getDay()]+' '+d.getDate()+' '+MTH[d.getMonth()]+' '+(d.getFullYear()+543);
  document.getElementById('ms').textContent='';
  document.getElementById('rdl').textContent='ทุกวัน'+DOW_TH[d.getDay()]+' ';
  document.getElementById('rn').className='rb ron';
  document.getElementById('rd').className='rb';
  ['by','bc','bz','bm','bg'].forEach(x=>document.getElementById(x).className='pb');
  const b=document.getElementById('cfm');b.disabled=true;b.textContent='เลือกรถและคนขับก่อน';
  document.getElementById('t-start').value=32;
  document.getElementById('t-end').value=72;
  updTime('end');
  document.getElementById('ovl').classList.add('open');
}

function sc(c){
  pend.car=c;
  document.getElementById('by').className='pb'+(c==='yaris'?' pby':'');
  document.getElementById('bc').className='pb'+(c==='city'?' pbc':'');
  document.getElementById('ms').textContent=c==='yaris'?'Yaris – สีขาว':'City – Sonic Grey Pearl';
  updBtn();
}

function sp(p){
  pend.person=p;
  document.getElementById('bz').className='pb'+(p==='Zen'?' pbz':'');
  document.getElementById('bm').className='pb'+(p==='Ma'?' pbm':'');
  document.getElementById('bg').className='pb'+(p==='Gene'?' pbg':'');
  updBtn();
}

function sr(r){
  pend.rep=r;
  document.getElementById('rn').className='rb'+(r==='none'?' ron':'');
  document.getElementById('rd').className='rb'+(r==='dow'?' ron':'');
  updBtn();
}

function updBtn(){
  const b=document.getElementById('cfm');
  if(!pend.car||!pend.person){
    b.disabled=true;
    b.textContent=!pend.car&&!pend.person?'เลือกรถและคนขับก่อน':!pend.car?'เลือกรถก่อน':'เลือกคนขับก่อน';
    return;
  }
  b.disabled=false;
  const d=new Date(pend.ds+'T12:00:00');
  const cn=pend.car==='yaris'?'Yaris':'City';
  b.textContent=pend.rep==='none'
    ?'จอง '+cn+' – '+pend.person
    :'จอง '+cn+' – ทุกวัน'+DOW_TH[d.getDay()];
}

async function doRes(){
  if(!pend.car||!pend.person) return;
  const d=new Date(pend.ds+'T12:00:00');
  const y=d.getFullYear(),m=d.getMonth(),dow=d.getDay();
  let dates=[pend.ds];
  if(pend.rep==='dow'){
    dates=[];
    const today=new Date(); today.setHours(0,0,0,0);
    const last=new Date(y,m+1,0).getDate();
    for(let i=1;i<=last;i++){
      const dd=new Date(y,m,i);
      if(dd.getDay()===dow&&dd>=today) dates.push(dk(dd));
    }
  }
  dates.forEach(ds=>{
    res[ds+'_'+pend.car]={person:pend.person,startTime:pend.startTime,endTime:pend.endTime};
  });
  closeMod(); render(); await saveToFirebase();
}

async function delOneRes(ds,c){
  delete res[ds+'_'+c];
  render();
  const remaining=[getResData(res[ds+'_yaris']),getResData(res[ds+'_city'])].filter(Boolean);
  if(remaining.length===0) closeView();
  else viewDay(ds);
  await saveToFirebase();
}

function viewDay(ds){
  const rvY=getResData(res[ds+'_yaris']);
  const rvC=getResData(res[ds+'_city']);
  if(!rvY&&!rvC) return;
  const d=new Date(ds+'T12:00:00');
  document.getElementById('vt').textContent='วัน'+DOW_TH[d.getDay()]+' '+d.getDate()+' '+MTH[d.getMonth()]+' '+(d.getFullYear()+543);
  const items=[];
  if(rvY) items.push({car:'yaris',rv:rvY});
  if(rvC) items.push({car:'city',rv:rvC});
  document.getElementById('vs').textContent=items.length+' การจอง';
  const list=document.getElementById('v-list');
  list.innerHTML='';
  items.forEach(({car,rv})=>{
    const carName=car==='yaris'?'Yaris':'City';
    const carCls=car==='yaris'?'det-vy':'det-vc';
    const personCls='det-v'+rv.person.toLowerCase();
    const timeStr=rv.startTime&&rv.endTime?rv.startTime+' – '+rv.endTime:'–';
    let barHTML='';
    if(rv.startTime&&rv.endTime){
      const s=timeToTick(rv.startTime),e=timeToTick(rv.endTime);
      barHTML='<div class="det-time-bar" style="margin-top:8px"><div class="det-time-fill" style="left:'+(s/96*100)+'%;width:'+((e-s)/96*100)+'%"></div></div>';
    }
    const card=document.createElement('div');
    card.className='det-card';
    card.innerHTML=
      '<div class="det-card-hd">'
        +'<span class="det-value '+carCls+'">'+carName+'</span>'
        +'<button class="del-mini" onclick="delOneRes(\''+ds+'\',\''+car+'\')">ลบ</button>'
      +'</div>'
      +'<div class="det-grid">'
        +'<div><div class="det-label">คนขับ</div><div class="det-value '+personCls+'">'+rv.person+'</div></div>'
        +'<div><div class="det-label">ช่วงเวลา</div><div class="det-value">'+timeStr+'</div></div>'
      +'</div>'
      +barHTML;
    list.appendChild(card);
  });
  document.getElementById('view-ovl').classList.add('open');
}

function closeMod(){document.getElementById('ovl').classList.remove('open')}
function closeView(){document.getElementById('view-ovl').classList.remove('open')}

function createPill(ds,c,rv){
  const pill=document.createElement('div');
  pill.className='pill p'+c;
  const timeStr=rv.startTime&&rv.endTime?rv.startTime+'–'+rv.endTime:'';
  pill.innerHTML='<div class="pill-info">'
    +'<span class="pill-name">'+rv.person+'</span>'
    +(timeStr?'<span class="pill-t">'+timeStr+'</span>':'')
    +'</div>';
  pill.addEventListener('click',e=>{e.stopPropagation();viewDay(ds);});
  return pill;
}

function render(){
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth()+mo,1);
  const y=base.getFullYear(),m=base.getMonth();
  document.getElementById('ml').textContent=MTH[m]+' '+(y+543);

  const g=document.getElementById('cg'); g.innerHTML='';
  DEN_TH.forEach((d,i)=>{
    const h=document.createElement('div');
    h.className='dow-head'+(i===0?' dow-sun':i===6?' dow-sat':'');
    h.textContent=d; g.appendChild(h);
  });

  const fd=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const pd=new Date(y,m,0).getDate();
  const tot=Math.ceil((fd+dim)/7)*7;

  for(let i=0;i<tot;i++){
    let d,inM=true;
    if(i<fd){d=new Date(y,m-1,pd-fd+1+i);inM=false;}
    else if(i-fd>=dim){d=new Date(y,m+1,i-fd-dim+1);inM=false;}
    else{d=new Date(y,m,i-fd+1);}

    const ds=dk(d),dow=d.getDay();
    const cell=document.createElement('div');
    cell.className='day-cell'+(inM?'':' dim');

    const dn=document.createElement('div');
    let dc='day-num';
    if(inM&&isT(d)) dc+=' today';
    else if(inM&&dow===0) dc+=' dsun';
    else if(inM&&dow===6) dc+=' dsat';
    dn.className=dc;
    dn.innerHTML='<span>'+d.getDate()+'</span>';
    cell.appendChild(dn);

    if(inM){
      const today=new Date(); today.setHours(0,0,0,0);
      const isPast=d<today;
      const rvY=getResData(res[ds+'_yaris']);
      const rvC=getResData(res[ds+'_city']);

      if(rvY||rvC){
        const strip=document.createElement('div');
        strip.className='pill-strip';

        if(rvY) strip.appendChild(createPill(ds,'yaris',rvY));
        if(rvC) strip.appendChild(createPill(ds,'city',rvC));
        cell.appendChild(strip);

        // Scroll-dot indicator for 2 reservations
        if(rvY&&rvC){
          const dots=document.createElement('div');
          dots.className='strip-dots';
          dots.innerHTML='<span class="sd active"></span><span class="sd"></span>';
          strip.addEventListener('scroll',function(){
            const idx=Math.round(this.scrollLeft/this.offsetWidth);
            dots.querySelectorAll('.sd').forEach((d,i)=>d.classList.toggle('active',i===idx));
          },{passive:true});
          cell.appendChild(dots);
        }
      } else if(!isPast){
        const ph=document.createElement('div');
        ph.className='plus-hint'; ph.textContent='+';
        cell.appendChild(ph);
      }

      // Tap cell background → open add modal (future/today only)
      if(!isPast){
        cell.addEventListener('click',e=>{
          if(!e.target.closest('.pill')) openMod(ds);
        });
      }
    }
    g.appendChild(cell);
  }
}

document.getElementById('ovl').addEventListener('click',function(e){if(e.target===this)closeMod()});
document.getElementById('view-ovl').addEventListener('click',function(e){if(e.target===this)closeView()});

render();

if(checkConfig()){
  document.addEventListener('firebase-ready',()=>setupFirebase());
} else {
  setSync('err','ยังไม่ตั้งค่า Firebase');
}
</script>
</body>
</html>
